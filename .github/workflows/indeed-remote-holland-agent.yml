name: Indeed Remote Holland Agent

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/indeed-remote-holland-agent.yml
      - lib/indeed-remote-holland.mjs
      - scripts/indeed-remote-holland-agent.mjs
      - scripts/indeed-remote-holland-parser.test.mjs
  workflow_dispatch:
    inputs:
      query:
        description: Search query (also used for Indeed URL)
        required: false
        default: remote
      location:
        description: Location label (Netherlands)
        required: false
        default: Nederland
      max_jobs:
        description: Maximum jobs to collect
        required: false
        default: "25"
  schedule:
    # Mon / Wed / Fri 07:15 UTC — no manual runs required
    - cron: "15 7 * * 1,3,5"

permissions:
  contents: read
  issues: write

jobs:
  indeed-remote-holland:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parser self-test
        run: node scripts/indeed-remote-holland-parser.test.mjs

      - name: Run Holland remote jobs agent
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          INDEED_QUERY: ${{ github.event.inputs.query || 'remote' }}
          INDEED_LOCATION: ${{ github.event.inputs.location || 'Nederland' }}
          INDEED_MAX_JOBS: ${{ github.event.inputs.max_jobs || '25' }}
        run: node scripts/indeed-remote-holland-agent.mjs

      - name: Upload job listings
        if: always() && hashFiles('indeed-remote-holland.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: indeed-remote-holland-${{ github.run_id }}
          path: |
            indeed-remote-holland.json
            indeed-remote-holland.md
          if-no-files-found: ignore

      - name: Open or update results issue
        if: success() && hashFiles('indeed-remote-holland.json') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const markdown = fs.readFileSync('indeed-remote-holland.md', 'utf8');
            const data = JSON.parse(fs.readFileSync('indeed-remote-holland.json', 'utf8'));
            const marker = '<!-- indeed-remote-holland-agent -->';
            const title = `Remote NL jobs — ${data.jobCount} listings (${new Date().toISOString().slice(0, 10)})`;
            const top = data.jobs.slice(0, 15).map((j, i) => `${i + 1}. [${j.title}](${j.url}) · _${j.source}_`).join('\n');
            const body = [
              marker,
              `## ${title}`,
              '',
              `**Query:** \`${data.query}\` · **Location:** \`${data.location}\``,
              '',
              `[Indeed — remote in Nederland](${data.indeedSearchUrl})`,
              '',
              top || '_No listings from feeds._',
              '',
              data.jobCount > 15 ? `_Full list in workflow artifacts (${data.jobCount} total)._` : '',
              '',
              `[Workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId})`,
              '',
              '---',
              '',
              markdown,
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 30,
            });

            const existing = issues.find((issue) => issue.body && issue.body.includes(marker));

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
