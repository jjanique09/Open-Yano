name: Example GitHub Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: Example task label for the agent run
        required: false
        default: health-check
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  example-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run example agent
        env:
          AGENT_TASK: ${{ github.event.inputs.task || 'health-check' }}
        run: node scripts/github-example-agent.mjs

      - name: Upload agent report
        uses: actions/upload-artifact@v4
        with:
          name: agent-report-${{ github.run_id }}
          path: agent-report.json
          if-no-files-found: error

      - name: Comment on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('agent-report.json', 'utf8'));
            const marker = '<!-- example-github-agent -->';
            const stepsTable = report.steps
              .map((s) => `| ${s.name} | ${s.status} |`)
              .join('\n');
            const body = [
              marker,
              '## Example GitHub Agent',
              '',
              'This is a **demo workflow** showing an automated agent on GitHub Actions.',
              '',
              `**Task:** \`${report.task}\` · **Commit:** \`${report.sha}\``,
              '',
              '| Step | Status |',
              '| --- | --- |',
              stepsTable,
              '',
              report.summary,
              '',
              `[View workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId})`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
